<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculator-Go</title>
  <link href="src/index.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
    integrity="sha384-5TcZemv2l/9On385z///+d7MSYlvIEw9FuZTIdZ14vJLqWphw7e7ZPuOiCHJcFCP" crossorigin="anonymous">

  <!-- The loading of KaTeX is deferred to speed up page rendering -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"
    integrity="sha384-cMkvdD8LoxVzGF/RPUKAcvmm49FQ0oxwDF3BGKtDXcEc+T1b2N+teh/OJfpU0jr6"
    crossorigin="anonymous"></script>

  <!-- To automatically render math in text elements, include the auto-render extension: -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"
    integrity="sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh" crossorigin="anonymous"
    onload="renderMathInElement(document.body);"></script>
</head>

<body>
  <section class="container">
    <div class="output">
      <div id="display-history"></div>
      <div id="display-current">
        <div id="input-display" contenteditable="true"></div>
        <div id="display-answer"></div>
      </div>
    </div>

    <div class="keyboard">
      <button id="CE">CE</button>
      <button id="clear">c</button>
      <button id="divide" value="/">/</button>
      <button id="mod" value="%">%</button>

      <button id="seven" value="7">7</button>
      <button id="eight" value="8">8</button>
      <button id="nine" value="9">9</button>
      <button id="multiply" value="*">*</button>

      <button id="four" value="4">4</button>
      <button id="five" value="5">5</button>
      <button id="six" value="6">6</button>
      <button id="minus" value="-">-</button>

      <button id="one" value="1">1</button>
      <button id="two" value="2">2</button>
      <button id="three" value="3">3</button>
      <button id="add" value="+">+</button>

      <button disabled class="noHover"></button>
      <button id="zero" value="0">0</button>
      <button value="sqrt(" data-latex="\sqrt{4}">√</button>
      <button id="equal">=</button>
    </div>
  </section>

  <script type="module" src="./src/index.js"></script>
</body>

</html>
</doctype>
