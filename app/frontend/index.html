<doctype html>
  <html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator-Go</title>
    <link href="src/index.css" rel="stylesheet" />
  </head>

  <body>
    <section class="container">
      <div class="output">
        <div id="display-history"></div>
        <div id="display-current">
          <input id="input-display" type="text" />
          <div id="display-answer"></div>
        </div>
      </div>

      <div class="keyboard">
        <button id="CE">CE</button>
        <button id="clear">C</button>
        <button id="divide" value="/">/</button>
        <button id="mod" value="%">%</button>

        <button id="seven" value="7">7</button>
        <button id="eight" value="8">8</button>
        <button id="nine" value="9">9</button>
        <button id="multiply" value="*">*</button>

        <button id="four" value="4">4</button>
        <button id="five" value="5">5</button>
        <button id="six" value="6">6</button>
        <button id="minus" value="-">-</button>

        <button id="one" value="1">1</button>
        <button id="two" value="2">2</button>
        <button id="three" value="3">3</button>
        <button id="add" value="+">+</button>

        <button disabled class="noHover"></button>
        <button id="zero" value="0">0</button>
        <button id="power" value=" ** ">^</button>
        <button id="equal">=</button>
      </div>
    </section>

    <script type="module" src="./src/index.js"></script>
  </body>

  </html>
</doctype>
